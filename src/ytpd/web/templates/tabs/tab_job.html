<h2>Job</h2>
<p>Paste a Deezer playlist, YouTube playlist, or YouTube video URL.</p>
<label class="field">
  <span>URL</span>
  <textarea id="job-url" rows="3" placeholder="https://..."></textarea>
</label>
<div class="job-actions">
  <button type="button" id="job-create">Create job</button>
  <button type="button" id="job-run">Run pipeline</button>
  <button type="button" id="job-cancel">Cancel</button>
  <button type="button" id="job-resolve">Resolve tracks</button>
  <button type="button" id="job-match">Match YouTube</button>
  <button type="button" id="job-download">Download</button>
  <button type="button" id="job-transcode">Transcode MP3</button>
  <button type="button" id="job-resume">Resume</button>
  <button type="button" id="job-refresh-list">Refresh jobs</button>
</div>
<section class="job-list-panel" aria-labelledby="job-list-heading">
  <h3 id="job-list-heading">Saved jobs</h3>
  <p class="hint">Select a job after restart — no need to copy a job id.</p>
  <ul id="job-list" class="job-list" aria-live="polite"></ul>
</section>
<p class="hint" id="job-status">No job selected.</p>
<ul id="job-track-list" class="job-track-list" aria-live="polite"></ul>

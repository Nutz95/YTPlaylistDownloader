<h2 data-i18n="progress.title">Progress</h2>
<p data-i18n="progress.intro">Live stage tracking. Download = media fetch via yt-dlp. Audio mode then encodes MP3 on CPU (libmp3lame).</p>
<label class="field">
  <span data-i18n="progress.active.job">Active job</span>
  <select id="progress-job-select">
    <option value="" data-i18n="progress.select.placeholder">— select a saved job —</option>
  </select>
</label>
<button type="button" id="progress-watch" data-i18n="progress.watch">Watch</button>
<p class="hint" id="progress-stage-line" data-i18n="progress.stage.none">No active stage.</p>
<div class="progress-global">
  <div class="progress-label" id="progress-global-label" data-i18n="progress.global.none">No active job.</div>
  <div class="progress-track" aria-hidden="true">
    <div class="progress-fill" id="progress-global-fill" style="width: 0%"></div>
  </div>
</div>
<h3 class="progress-section-title" data-i18n="progress.section.active">Active</h3>
<div id="progress-media-list" class="progress-media-list" aria-live="polite"></div>
<h3 class="progress-section-title" data-i18n="progress.section.failures">Failures</h3>
<div id="progress-fail-list" class="progress-media-list progress-fail-list" aria-live="polite"></div>

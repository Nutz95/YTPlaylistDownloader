[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpd"
version = "0.1.0"
description = "Local Deezer/YouTube playlist downloader with GPU-assisted MP3 transcoding"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "yt-dlp[default,deno]>=2026.10.21",
    "httpx>=0.28.1",
    "sqlalchemy>=2.1.6",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
]

[project.scripts]
ytpd = "ytpd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytpd = [
    "web/templates/*.html",
    "web/templates/tabs/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "config/default.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

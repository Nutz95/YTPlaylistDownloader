[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpd"
version = "0.1.0"
description = "Local Deezer/YouTube playlist downloader with GPU-assisted MP3 transcoding"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "yt-dlp>=2025.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
ytpd = "ytpd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytpd = [
    "web/templates/*.html",
    "web/templates/tabs/*.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "config/default.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
